name: AWS CloudFormation + Ansible CI/CD

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

    
    # Checkout Repository
    - name: Checkout Code
      uses: actions/checkout@v3

    # Configure AWS Access

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
        aws-region: us-east-1

   
    # Deploy Infrastructure
    
    - name: Deploy CloudFormation Stack
      run: |
        aws cloudformation deploy \
          --template-file cloudformation/ec2.yml \
          --stack-name webstack01 \
          --capabilities CAPABILITY_NAMED_IAM

   
    #  Get EC2 Public IP
   
    - name: Get Public IP
      id: getip
      run: |
        IP=$(aws cloudformation describe-stacks \
        --stack-name webstack01 \
        --query "Stacks[0].Outputs[0].OutputValue" \
        --output text)
        echo "EC2_IP=$IP" >> $GITHUB_ENV
        echo "Waiting for EC2 instance to be ready..."
        sleep 30

    - name: Wait for EC2 SSH
      run: |
        for i in {1..30}; do
          if timeout 5 bash -c "</dev/tcp/${{ env.EC2_IP }}/22" 2>/dev/null; then
            echo "SSH port is open"
            exit 0
          fi
          echo "Attempt $i: SSH port not ready, waiting..."
          sleep 10
        done
        exit 1

    # Run Ansible on EC2

    - name: Configure Server & Deploy App
      uses: appleboy/ssh-action@master
      with:
        host: ${{ env.EC2_IP }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |

          echo "Connected to EC2"

          # install ansible + git
          sudo apt-get update -y
          sudo apt-get install -y ansible git

          # clone repo fresh
          rm -rf deployrepo
          git clone https://github.com/yuvagiridharan/automated-docker-deployment.git deployrepo

          cd deployrepo

          # run ansible playbook
          ansible-playbook -i ansible/hosts ansible/playbook.yml
